# План закупок: расчёт и история прогонов → дашборд на GitHub Pages → дайджест в Telegram.
# Запуск: каждый день в 23:47 UTC (06:47 по Новосибирску — к 07:00 план готов; не ровный час: в 00:00 UTC
# у GitHub пик, плановые запуски там задерживаются и пропадают), при пуше новых CSV в data/raw/ и кнопкой
# «Run workflow» на вкладке Actions. Секреты — Settings → Secrets and variables → Actions
# (DEEPSEEK_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID); без них расчёт и сайт работают,
# записки ИИ и дайджеста не будет. Петли нет: бот коммитит только history/ и с [skip ci],
# а пуш-триггер смотрит только на data/raw/**.
#
# Порядок: plan (расчёт, коммит истории, артефакт сайта и out/) → deploy (публикация Pages) →
# notify (дайджест со ссылкой на уже обновлённый сайт). Ключ DeepSeek есть только у шага расчёта,
# секреты Telegram — только у шага дайджеста; права у каждого job — минимальные.
name: План закупок

on:
  schedule:
    - cron: "47 23 * * *"
  push:
    branches: [main, master]
    paths:
      - "data/raw/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: procurement-plan
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TZ: Asia/Novosibirsk  # «пересчитано …» на дашборде и дата в коммите — по Новосибирску
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Зависимости
        run: pip install -r requirements.txt

      - name: Кеш записки ИИ (тот же вход — без повторного запроса)
        uses: actions/cache@v4
        with:
          path: .cache/ai
          key: ai-note-${{ github.run_id }}
          restore-keys: ai-note-

      - name: Расчёт, записка ИИ, сайт
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python -m procurement run

      - name: Коммит истории прогонов
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/
          if git diff --cached --quiet; then
            echo "История не изменилась — коммит не нужен."
          else
            git commit -m "history: прогон $(date +%Y-%m-%d) [skip ci]"
            git pull --rebase --autostash
            git push
          fi

      - name: Не дать GitHub выключить расписание
        # GitHub отключает cron в репозитории без коммитов 60 дней. Пока выгрузка не меняется, история
        # не коммитится — раз в 50 дней пустой коммит (с [skip ci]; пуш-триггер смотрит только data/raw/).
        run: |
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$age" -gt $(( 50 * 86400 )) ]; then
            git commit --allow-empty -m "keepalive: расписание активно [skip ci]"
            git pull --rebase --autostash
            git push
          else
            echo "Последний коммит $(( age / 86400 )) дн. назад — не нужно."
          fi

      - name: Сайт для GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Результаты расчёта для дайджеста
        uses: actions/upload-artifact@v4
        with:
          name: plan-out
          path: |
            out/plan.json
            out/diff.json
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Зависимости
        run: pip install -r requirements.txt

      - uses: actions/download-artifact@v4
        with:
          name: plan-out
          path: out

      - name: Дайджест в Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          # адрес сайта — из деплоя; запасной — из имени репозитория (непуст при любом триггере)
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          export SITE_URL="${PAGE_URL:-https://${owner}.github.io/${GITHUB_REPOSITORY#*/}/}"
          echo "Ссылка в дайджесте: ${SITE_URL}"
          python -m procurement notify
