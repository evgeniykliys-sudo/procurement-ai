# Параметры планирования закупок. Меняются здесь, без правки кода.
# Отсутствующий ключ = значение по умолчанию из procurement/config.py.

# --- Рентабельность и ассортимент ---
# Минимальная средняя наценка к себестоимости за 12 мес, %. Ниже — не в заказ, а на пересмотр цены.
min_markup_pct = 25
# Мёртвый ассортимент: нет продаж столько месяцев.
dead_months = 12

# --- Политика заказа ---
# Покрытие, дн., если в ERP target_cover_days = 0 (сейчас у всех SKU).
default_cover_days = 60
# Период пересмотра плана, дн.: закупщики планируют раз в месяц.
review_period_days = 30
# Потолок страхового запаса: не больше стольких месяцев спроса периода покрытия — того, на который
# приходит заказ (у прерывистых продаж разброс огромный — без потолка страховой больше самого спроса;
# у сезонных товаров с приходом вне сезона страховой не раздувается пиком, который придётся на плечо).
safety_cap_months = 2
# Порог излишка: остаток + в пути покрывают больше стольких месяцев прогноза.
excess_cover_months = 12
# Дефицит: товар считается кончившимся, если накопленный неудовлетворённый спрос дошёл до стольких
# штук; «дефицит неизбежен» — если столько теряется до прихода заказа, размещённого сегодня (пара
# дней нуля у медленной позиции — не дефицит). «Хватит до» — первый день такого дефицита (при нуле
# на складе сегодня — сегодня).
stockout_min_lost_qty = 1
# Минимальный заказ, шт.: потребность меньше — не заказываем; заказ не больше прогноза за
# excess_cover_months (иначе у медленных позиций шаг округления раздувает заказ на годы вперёд).
min_order_qty = 1
# Кратность партии = медиана прихода SKU, округлённая до шага. Пары [меньше чем, шаг] по порядку,
# inf — «всё остальное»: < 100 шт. — до 10, < 1000 — до 50, иначе — до 100.
lot_rounding = [[100, 10], [1000, 50], [inf, 100]]
# До типичной партии (медиана приходов SKU) заказ округляется, только если это добавляет не больше
# стольких месяцев среднего прогнозного спроса; иначе — шагом из lot_rounding (медиана приходов —
# привычка, а не минимальный заказ поставщика: 82 шт. потребности не превращаются в 1 900).
lot_max_overage_months = 1
# ABC по количеству продаж за 12 мес внутри категории: A — первые 80%, B — до 95%, C — остальное.
abc_thresholds = [0.80, 0.95]

# --- Плечо поставки, дн. ---
# Если нет истории ни по SKU, ни по поставщику.
lead_default_days = 123
# Пол и потолок плеча.
lead_min_days = 30
lead_max_days = 180

# --- Открытые заказы ---
# Просроченный заказ (плановая дата прошла) ещё считается «в пути», если просрочка не больше, дн.
overdue_grace_days = 90
# Через сколько дней после даты анализа ждём такой просроченный заказ.
overdue_eta_days = 30

# --- Надёжность поставщика (получено / заказано) ---
# Ниже этой доли заказ увеличивается: делится на долю исполнения.
reliability_min_ratio = 0.95
# Поправка на недовоз не больше ×1.2 — иначе риск излишка.
reliability_max_uplift = 1.2
# Учитываются закрытые/исполненные заказы старше стольких дней.
reliability_min_age_days = 180
# Поставщики часто опаздывают: приход засчитывается заказу, если пришёл до promised_date + N дн.
reliability_receipt_window_days = 180

# --- Прогноз спроса ---
# Границы тренда (продажи последних 12 мес / предыдущих 12 мес).
trend_clip = [0.5, 1.5]
# Затухание тренда: прогноз = уровень × тренд^N (1 — тренд целиком, 0 — без тренда). 0.5 — по бэктесту:
# ошибка по SKU ниже, чем с трендом целиком (рост прошлого года не переносится на следующий полностью).
trend_damping = 0.5
# Новинка: меньше стольких полных месяцев истории → уровень по имеющимся месяцам, флаг «мало истории».
new_sku_months = 6
# Свой сезонный профиль SKU смешивается с профилем категории, если истории не меньше, мес.
shrink_min_months = 24
# Вес своего профиля в смеси (0 — только категория, 1 — только свой).
season_own_weight = 0.5
# Сезонный коэффициент месяца считается по всем годам; год, где отношение продаж к среднему
# отличается от медианы по годам больше чем во столько раз, обрезается (разовая отгрузка — не сезон).
season_outlier_factor = 2.0
# Если средний сезонный коэффициент месяцев, по которым считается уровень, ниже порога (видны
# только месяцы не сезона), уровень берётся по 24 мес, а если и там мало — как средние продажи
# без сезонной поправки; флаги «уровень по 24 мес» / «уровень без сезонной поправки».
level_min_season_index = 0.5
# Прогноз на год не выше N× продаж последних 12 мес — защита от перезаказа по упущенному спросу.
# Только для SKU с историей ≥ 12 мес; превышение — весь ряд прогноза уменьшается пропорционально
# (сезонная форма та же), флаг «упущенный спрос — проверить».
forecast_cap_vs_last_year = 2.0
# Горизонт прогноза, мес.
forecast_months = 18
# День выгрузки неполного месяца: дата анализа = этот день последнего месяца продаж.
partial_day = 13
# Дата анализа вручную (ГГГГ-ММ-ДД). Не задана — определяется по данным.
# as_of = "2026-08-13"

# --- Бэктест ---
# Срез — 1-е число месяца даты анализа минус столько месяцев; прогноз сверяется с фактом этих месяцев.
backtest_months = 12

# --- «Что изменилось» ---
# Изменение потребности больше стольких процентов попадает в список изменений.
change_threshold_pct = 20

# --- ИИ-аналитик (DeepSeek, OpenAI-совместимый API). Ключ — только в DEEPSEEK_API_KEY. ---
llm_model = "deepseek-chat"
llm_base_url = "https://api.deepseek.com"
# Таймаут запроса, с.
llm_timeout_s = 60

# --- Публикация ---
# Адрес дашборда (GitHub Pages) для дайджеста.
site_url = ""

# Уровень сервиса по классу ABC (для страхового запаса). Таблица — последней в файле.
[service_level]
A = 0.95
B = 0.90
C = 0.80
